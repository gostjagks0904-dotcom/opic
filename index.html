<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오픽 AI 모의고사·학습</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one narrow answer-sheet column; OMR bubbles carry selection, progress and the grade */
  --paper:#EDF0F5; --sheet:#FFFFFF; --ink:#141B2D; --ink-2:#566074; --line:#D2D8E3;
  --mark:#CC2B63; --on-mark:#FFFFFF; --mark-soft:#FAE1EA; --ok:#1C7F55; --warn:#A2640B;
  --display:"Noto Serif KR","Apple Myungjo","Batang",serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D111A; --sheet:#161C29; --ink:#E8ECF4; --ink-2:#9BA6BA; --line:#2C3547;
    --mark:#F26A9B; --on-mark:#1B0A12; --mark-soft:#3A1B2A; --ok:#55C794; --warn:#E3B155;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D111A; --sheet:#161C29; --ink:#E8ECF4; --ink-2:#9BA6BA; --line:#2C3547;
  --mark:#F26A9B; --on-mark:#1B0A12; --mark-soft:#3A1B2A; --ok:#55C794; --warn:#E3B155;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 56px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
h1{font:900 1.875rem/1.2 var(--display);letter-spacing:-.01em}
h2{font:700 1.125rem/1.3 var(--display)}
h3{font:600 .9375rem/1.4 var(--body)}
h4{font:600 .8125rem/1.4 var(--body);color:var(--ink-2);letter-spacing:.02em}
p,ul,ol{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:.875rem;color:var(--ink-2)}
.status{font-size:.9375rem;color:var(--ink-2);min-height:1.5em}
.status.err{color:var(--mark)}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

.mast{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
.lede{color:var(--ink-2);max-width:34em}

.ladder{list-style:none;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:0}
.ladder li{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.6875rem;color:var(--ink-2)}
.ladder i{width:12px;height:19px;border:1.5px solid var(--mark);border-radius:50%}
.ladder li.hit{color:var(--ink);font-weight:600}
.ladder li.hit i{background:var(--ink);border-color:var(--ink)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-top:3px solid var(--mark);border-radius:3px;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stepno{display:inline-grid;place-items:center;width:26px;height:26px;border:1.5px solid var(--ink);font-size:.875rem}
.stepko{color:var(--ink-2);font-size:.875rem}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
select,input[type="password"]{min-height:44px;width:100%;padding:8px 10px;border:1px solid var(--ink);border-radius:3px;background:var(--sheet);color:var(--ink);font:400 1rem var(--body)}

.chips{border:0;padding:0;margin:0;min-width:0;display:flex;flex-wrap:wrap;gap:8px}
.chips legend{padding:0;margin-bottom:8px;font-size:.8125rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.bub{display:inline-block;width:10px;height:16px;border:1.5px solid var(--mark);border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--ink);font:400 .9375rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.chip[aria-pressed="true"] .bub{background:var(--ink);border-color:var(--ink)}

.seg{display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-height:44px;padding:8px 6px;border:0;border-left:1px solid var(--ink);background:transparent;color:var(--ink);font:400 .9375rem var(--body);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);font-weight:600}
.opt{display:flex;flex-direction:column;gap:8px}

.facts{padding-left:1.2em;color:var(--ink-2);font-size:.9375rem}
.caps{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.8125rem;color:var(--ink-2)}
.caps b{color:var(--ink);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:3px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 1rem var(--body);cursor:pointer}
.btn.primary{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.btn.big{min-height:54px;font-size:1.0625rem;width:100%}
.btn.link{border:0;min-height:44px;padding:8px 4px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn:disabled,.mic:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.tagline{font-size:.875rem;color:var(--ink-2);text-align:right;min-width:0}

/* exam */
.examtop{display:flex;flex-direction:column;gap:12px}
.omr{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.omr li{width:10px;height:16px;border:1.5px solid var(--mark);border-radius:50%}
.omr li.done{background:var(--ink);border-color:var(--ink)}
.omr li.now{background:var(--mark)}
.examtop-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.qno{font-family:var(--mono);font-size:1.75rem;line-height:1}
.qno small{font-size:.875rem;color:var(--ink-2)}
.clock{font-family:var(--mono);font-size:1.125rem;font-variant-numeric:tabular-nums}
.clock.low{color:var(--mark)}
.ava-row{display:flex;align-items:center;gap:14px}
.wave{display:flex;align-items:center;gap:3px;height:36px;width:38px;flex:none}
.wave i{width:5px;height:8px;background:var(--ink-2);border-radius:2px}
.wave.on i{background:var(--mark);animation:wv 900ms ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:-150ms}
.wave.on i:nth-child(3){animation-delay:-420ms}
.wave.on i:nth-child(4){animation-delay:-260ms}
.wave.on i:nth-child(5){animation-delay:-560ms}
@keyframes wv{0%,100%{height:8px}50%{height:32px}}
.ava-txt{display:flex;flex-direction:column;min-width:0}
.ava-txt strong{font:700 1.0625rem var(--display)}
.ava-txt span{font-size:.875rem;color:var(--ink-2)}
.qtext{border-left:3px solid var(--mark);padding-left:12px;overflow-wrap:anywhere}
.answer-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.answer-head label{font:700 1.0625rem var(--display)}
.answer-head .meta{font-family:var(--mono);font-size:.8125rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
textarea{display:block;width:100%;min-height:10.5rem;padding:0 12px;border:1px solid var(--line);border-radius:3px;background-color:var(--sheet);color:var(--ink);font:400 1rem/1.75rem var(--body);resize:vertical;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 1.75rem;background-position:0 calc(1.75rem - 1px);background-attachment:local}
.partial{min-height:1.5em;font-size:.9375rem;color:var(--ink-2);font-style:italic;overflow-wrap:anywhere}
.mic{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:10px 22px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font:600 1rem var(--body);cursor:pointer}
.mic .dot{width:12px;height:12px;border-radius:50%;background:var(--mark)}
.mic.on{background:var(--mark);border-color:var(--mark);color:var(--on-mark)}
.mic.on .dot{background:var(--on-mark);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.examfoot{position:sticky;bottom:0;background:var(--paper);padding:10px 0}

/* result */
.grade-label{font-size:.8125rem;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.grade-big{font:900 4.5rem/1 var(--display);letter-spacing:-.02em}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:.9375rem}
.bar{height:8px;background:var(--mark-soft)}
.bar i{display:block;height:100%;background:var(--mark)}
.plain{padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.qa{border-top:1px solid var(--line)}
.qa summary{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";font-family:var(--mono);color:var(--ink-2);width:1em;text-align:center}
.qa[open] summary::after{content:"−"}
.qa .qt{flex:1;min-width:0;font-size:.9375rem}
.pill{font-family:var(--mono);font-size:.8125rem;padding:1px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.pill.hi{color:var(--ok);border-color:var(--ok)}
.pill.lo{color:var(--warn);border-color:var(--warn)}
.qa-body{display:flex;flex-direction:column;gap:10px;padding:0 0 18px}
.a-en{background:var(--paper);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:3px}
.fixes{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.fixes li{display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.fixes del{color:var(--ink-2)}
.fixes ins{text-decoration:none;font-weight:600;color:var(--ok)}
.fixes span{font-size:.875rem;color:var(--ink-2)}
.model{white-space:pre-wrap;overflow-wrap:anywhere;border-left:3px solid var(--ok);padding-left:12px}
@media (max-width:420px){ .fields{grid-template-columns:1fr} .grade-big{font-size:3.75rem} }
@media (prefers-reduced-motion:reduce){ .wave.on i{animation:none;height:20px} .mic.on .dot{animation:none} }
</style>
</head>

async function apiFetch(url, init) {
  let res, body = null;
  try { res = await fetch(url, init); }
  catch (e) { throw (e && e.name === 'AbortError') ? apiErr('cancelled') : apiErr('network', e && e.message); }
  try { body = await res.json(); } catch (e) {}
  if (res.ok) return body || {};
  const msg = (body && body.error && (body.error.message || body.error.status)) || ('HTTP ' + res.status);
  if (res.status === 429) throw apiErr('rate_limited', msg);
  if (res.status === 401 || res.status === 403 || /api key/i.test(msg)) throw apiErr('bad_key', msg);
  throw apiErr('upstream_error', msg);
}
async function listModels(p, key) {
  if (p === 'gemini') {
    const d = await apiFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': key } });
    const ver = n => parseFloat((n.match(/^gemini-(\d+(?:\.\d+)?)/) || [])[1]) || 0;
    return (d.models || [])
      .filter(m => /^models\/gemini/.test(m.name || '') && (!m.supportedGenerationMethods || m.supportedGenerationMethods.includes('generateContent')) && !/(image|tts|audio|live|embedding|robotics|computer-use)/.test(m.name))
      .map(m => m.name.replace(/^models\//, '')).sort((a, b) => ver(b) - ver(a) || a.localeCompare(b));
  }
  const d = await apiFetch('https://api.openai.com/v1/models', { headers: { Authorization: 'Bearer ' + key } });
  return (d.data || [])
    .filter(m => /^(gpt-|o\d|chatgpt-)/.test(m.id || '') && !/(audio|realtime|transcribe|tts|image|embedding|search|instruct|codex|moderation)/.test(m.id) && !/-\d{4}-\d{2}-\d{2}$/.test(m.id))
    .sort((a, b) => (b.created || 0) - (a.created || 0)).map(m => m.id);
}
async function callModel(prompt, opts) {
  const p = CONN.provider, c = conn(), signal = opts && opts.signal;
  if (!c.key) throw apiErr('no_key');
  const model = (opts && opts.modelTier === 'complex' && c.grade) || c.model;   // grading may use a stronger model
  if (!model) throw apiErr('no_model');
  let text = '';
  if (p === 'gemini') {
    const d = await apiFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: 'POST', signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': c.key },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: prompt }] }] }) });
    const cand = d.candidates && d.candidates[0];
    text = ((cand && cand.content && cand.content.parts) || []).filter(x => !x.thought).map(x => x.text || '').join('');
    if (!text && d.promptFeedback && d.promptFeedback.blockReason) throw apiErr('refused', d.promptFeedback.blockReason);
  } else {
    const d = await apiFetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST', signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + c.key },
      body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }] }) });
    const m = d.choices && d.choices[0] && d.choices[0].message;
    text = (m && m.content) || '';
    if (!text && m && m.refusal) throw apiErr('refused', m.refusal);

  return text;
}
function parseLoose(text) {
  const tries = [text, (text.match(/```(?:json)?\s*([\s\S]*?)```/) || [])[1]];
  const a = text.search(/[\[{]/), b = Math.max(text.lastIndexOf(']'), text.lastIndexOf('}'));
  if (a >= 0 && b > a) tries.push(text.slice(a, b + 1));
  for (const t of tries) { if (t) { try { return JSON.parse(t); } catch (e) {} } }
  throw { code: 'invalid_json', message: 'no JSON in reply', text };
}

function localDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const subs = { partial: [], final: [], state: [] }, waiters = [];
  const android = /Android/i.test(navigator.userAgent);
  let rec = null, state = 'idle', want = false, endReason = 'stopped';
  const set = (s, reason) => { state = s; subs.state.forEach(f => f({ state: s, reason })); };
  const begin = () => {
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = !android;
    rec.onstart = () => set('listening');
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) { if (t) subs.final.forEach(f => f({ text: ' ' + t })); } else interim += ' ' + t;
      }
      subs.partial.forEach(f => f({ text: interim.trim() }));
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { want = false; endReason = 'not_granted'; }
      else if (e.error === 'network' || e.error === 'audio-capture') { want = false; endReason = 'upstream_error'; }
    };
    rec.onend = () => {
      if (want) { try { begin(); return; } catch (x) { endReason = 'upstream_error'; } }   // the browser ends a session after a pause: keep listening
      rec = null; want = false; set('idle', endReason);
      waiters.splice(0).forEach(f => f());
    };
    rec.start();
  };
  return {
    active: () => state !== 'idle',
    start: () => new Promise((res, rej) => {
      if (state !== 'idle') return res();
      want = true; endReason = 'stopped'; set('starting');
      try { begin(); res(); } catch (x) { want = false; rec = null; set('idle', 'upstream_error'); rej({ code: 'upstream_error', message: String(x) }); }
    }),
    stop: () => new Promise(res => {
      if (state === 'idle' || !rec) return res();
      want = false; waiters.push(res); set('finishing');
      try { rec.stop(); } catch (x) {}
      setTimeout(res, 1500);                    // never leave "next" hanging if no end event comes
    }),
    onPartial: f => { subs.partial.push(f); }, onFinal: f => { subs.final.push(f); }, onState: f => { subs.state.push(f); }
  };
}

/* ---------- blueprint: the page picks topics and question types at random, AI writes the questions ---------- */
function buildBlueprint(p) {
  const L1 = p.level, L2 = clamp(p.level + ({ easy: -1, same: 0, hard: 1 }[p.adjust] || 0), 1, 6);
  let mine = SURVEY.flatMap(g => g[1]).filter(t => p.topics.includes(t[0]));
  mine.push(['home', '사는 곳', 'your home and the area you live in']);
  if (p.status === 'student') mine.push(['school', '학교·수업', 'your school and your classes']);
  if (p.status === 'worker') mine.push(['work', '직장·업무', 'your job and your workplace']);
  mine = shuffle(mine);
  const recent = S.recent.surprise || [];
  let pool = SURPRISE.filter(t => !recent.includes(t[0]));
  if (pool.length < 6) pool = SURPRISE.slice();
  pool = shuffle(pool);
  const usedSurprise = [];
  const takeSurvey = () => (mine.length ? mine.shift() : null);
  const takeSurprise = () => { const t = pool.shift(); usedSurprise.push(t[0]); return t; };
  const q = [{ no: 1, cat: 'self', catKo: CAT.self, topicKo: '자기소개', topicEn: 'self-introduction', typeKo: '자기소개', typeEn: '', level: L1,
    text: 'Let\'s start the interview now. Tell me a little about yourself.' }];
  const add = (no, cat, topic, type, level) => q.push({ no, cat, catKo: CAT[cat], topicKo: topic[1], topicEn: topic[2], typeKo: TYPES[type][0], typeEn: TYPES[type][1], level, text: '' });

  const nSur = p.surprise === 'focus' ? 3 : pick([1, 2]);
  shuffle([0, 1, 2].map(i => (i < nSur ? 'surprise' : 'survey'))).forEach((cat, i) => {
    const lvl = i < 2 ? L1 : L2;               // difficulty is re-adjusted after question 7
    let topic = cat === 'survey' ? takeSurvey() : null, c = cat;
    if (!topic) { topic = takeSurprise(); c = 'surprise'; }
    const types = lvl >= 5 ? [pick(['desc', 'routine']), pick(['first', 'recent', 'cmp']), 'memo'] : ['desc', pick(['routine', 'first']), pick(['recent', 'memo'])];
    types.forEach((t, k) => add(2 + i * 3 + k, c, topic, t, lvl));
  });
  const rpTopic = (Math.random() < 0.5 && mine.length) ? takeSurvey() : pick(RP);
  ['rp1', 'rp2', 'rp3'].forEach((t, k) => add(11 + k, 'roleplay', rpTopic, t, L2));
  let last = Math.random() < (L2 >= 5 ? 0.6 : 0.3) ? null : takeSurvey(), lastCat = 'survey';
  if (!last) { last = takeSurprise(); lastCat = 'surprise'; }
  (L2 >= 5 ? ['cmp', 'issue'] : ['desc', 'askava']).forEach((t, k) => add(14 + k, lastCat, last, t, L2));
  return { questions: q, usedSurprise, label: L1 + '-' + L2 };
}

function normResult(r, n) {
  if (!r || typeof r !== 'object') throw new Error('shape');
  let lv = String(r.level || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (lv === 'IM') lv = 'IM2';
  if (!LEVELS.includes(lv)) throw new Error('level');
  const num = v => clamp(Math.round((Number(v) || 0) * 2) / 2, 0, 5);
  const list = v => (Array.isArray(v) ? v.map(String).filter(Boolean).slice(0, 4) : []);
  const by = {};
  (Array.isArray(r.questions) ? r.questions : []).forEach(x => { if (x && x.no) by[x.no] = x; });
  const questions = [];
  for (let i = 1; i <= n; i++) {
    const x = by[i] || {};
    questions.push({
      no: i, score: num(x.score), feedback: String(x.feedback || ''),
      fixes: (Array.isArray(x.fixes) ? x.fixes : []).filter(f => f && f.from && f.to).slice(0, 2).map(f => ({ from: String(f.from), to: String(f.to), why: String(f.why || '') }))
    });
  }
  const sc = r.scores || {};
  return { level: lv, summary: String(r.summary || ''), scores: Object.fromEntries(SCORE_LABELS.map(([k]) => [k, num(sc[k])])), strengths: list(r.strengths), priorities: list(r.priorities), questions };
}

  if (Array.isArray(arr) && arr.length === 15) arr = arr.slice(1);

  S.recent.questions = arr.map(t => t.slice(0, 110)).concat(S.recent.questions || []).slice(0, 28);
  S.exam = { mode, questions: bp.questions, label: bp.label, idx: 0, startedAt: Date.now(), endsAt: mode === 'exam' ? Date.now() + 40 * 60 * 1000 : null,
    answers: bp.questions.map(() => ({ text: '', sec: 0, voice: false })), plays: bp.questions.map(() => 0), fb: bp.questions.map(() => null), timeUp: false };
  S.result = null; S.phase = 'exam'; busy = null; save(); render();
}

function stopSpeaking() {
  speakToken++;
  try { if (CAP.tts && CAP.tts.active()) CAP.tts.stop().catch(() => {}); } catch (e) {}
  try { if (!CAP.tts && 'speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  const w = $('#wave'); if (w) w.classList.remove('on');
}
async function playQuestion() {
  const E = S.exam, idx = E.idx;
  if (E.mode !== 'study' && E.plays[idx] >= 2) return;
  let mode = audioMode();
  if (mode === 'pending') { $('#avaState').textContent = '음성을 준비하고 있어요…'; await pTts; if (S.phase !== 'exam' || S.exam.idx !== idx) return; mode = audioMode(); }
  if (mode === 'none') return revealText('음성을 쓸 수 없어서 문제를 글로 보여드려요.');
  const text = E.questions[idx].text, token = ++speakToken;
  E.plays[idx]++; save(); setSpeaking(true);
  let settled = false;
  const done = ok => {
    if (settled) return; settled = true;
    if (token !== speakToken || S.phase !== 'exam') return;
    setSpeaking(false);
    if (ok) beginAnswer(); else revealText('음성 재생이 안 돼서 문제를 글로 보여드려요.');
  };
  if (mode === 'claude') {
    CAP.tts.speak(text, { language: 'en' }).then(() => done(true), e => {
      const c = e && e.code;
      if (c === 'stopped') { settled = true; if (token === speakToken) { setSpeaking(false); beginAnswer(); } return; }
      if (c === 'not_granted' || c === 'unavailable') CAP.ttsOff = true;   // respect the viewer's choice: no other voice
      done(false);
    });
    return;
  }
  try {
    const u = new SpeechSynthesisUtterance(text);
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    u.lang = 'en-US'; u.rate = 0.95;
    let started = false;
    u.onstart = () => { started = true; };
    u.onend = () => done(true);
    u.onerror = () => done(false);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    setTimeout(() => { if (!started && !settled) { try { speechSynthesis.cancel(); } catch (e) {} CAP.synthOff = true; done(false); } }, 4000);
  } catch (e) { CAP.synthOff = true; done(false); }
}

function wireDictation(d) {
  d.onPartial(({ text }) => { const el = $('#partial'); if (el) el.textContent = text || ''; });
  d.onFinal(({ text }) => {
    if (S.phase !== 'exam' || !text) return;
    const a = curA();
    a.text = a.text ? a.text + text : text.replace(/^\s+/, '');
    a.voice = true;
    const ta = $('#ans'); if (ta) { ta.value = a.text; ta.scrollTop = ta.scrollHeight; }
    updateWc(); saveSoon();
  });
  d.onState(({ state, reason }) => {
    micState = state;
    if (state === 'idle') {
      const p = $('#partial'); if (p) p.textContent = '';
      if (reason === 'not_granted' || reason === 'unavailable') CAP.dictOff = true;
      if (reason === 'hidden') setHint('화면을 벗어나서 받아쓰기가 멈췄어요. 버튼을 눌러 이어서 말하세요.');
    }
    syncExam();
  });
}
function micClick() {
  const d = CAP.dict; if (!d) return;
  if (d.active()) { d.stop().catch(() => {}); return; }
  stopSpeaking(); beginAnswer();
  d.start({ language: 'en' }).catch(e => {
    const c = e && e.code;
    if (c === 'not_granted' || c === 'unavailable') { CAP.dictOff = true; delete $('#micHint').dataset.msg; syncExam(); }
    else if (c === 'rate_limited') setHint('잠시 뒤에 다시 눌러 주세요.');
    else if (c !== 'stopped' && c !== 'dismissed') setHint('마이크를 켜지 못했어요. 다시 눌러 주세요.');
  });
}
async function settleAnswer() {
  stopSpeaking();
  if (CAP.dict && micState !== 'idle') { try { await CAP.dict.stop(); } catch (e) {} }
  const a = curA(), ta = $('#ans');
  if (ta) a.text = ta.value;
  a.sec = curSec(); tStart = null;
}
let navLock = false;
async function go(delta) {
  if (navLock) return;
  navLock = true;
  if (busy) busy.abort();
  try {
    await settleAnswer();
    const E = S.exam, n = E.idx + delta;
    if (n >= E.questions.length) finishExam(false);
    else { E.idx = Math.max(0, n); save(); render(); }
  } finally { navLock = false; }
}

/* ---------- study mode: feedback on one answer at a time ---------- */
function studyPrompt(q, a) {
  const t = a.text.trim().slice(0, 2500);
  return [
    'You are an OPIc tutor and rater (ACTFL guidelines) helping a Korean learner practise one question at a time.',
    `Question (${q.catKo}; topic: ${q.topicEn}; type: ${q.typeKo}; difficulty level ${q.level} of 6): ${q.text}`,
    `Learner answer (${a.voice ? 'speech-to-text' : 'typed'}, ${words(t)} words, ${Math.round(a.sec)} seconds including thinking): ${t || '(no answer)'}`,
    '',
    'You only have the transcript: do not judge pronunciation or intonation, and ignore capitalization, punctuation and obvious speech-recognition slips. Be honest and specific; do not inflate.',
    'Reply in plain text with no markdown, using exactly these line prefixes, one item per line, in this order:',
    'SCORE: 0 to 5 in steps of 0.5 for this one answer (task completion, sentence-to-paragraph structure, grammar, vocabulary, detail)',
    'LEVEL: the single OPIc level this answer sounds like: NL, NM, NH, IL, IM1, IM2, IM3, IH or AL',
    'FEEDBACK: 2-3 sentences in Korean (해요체): what worked, and the most important thing to fix, tied to what the learner actually said',
    'FIX: phrase copied from the learner\'s answer => corrected phrase :: short reason in Korean',
    'BETTER: the learner\'s answer rewritten one level higher, all on one line: keep their content and ideas, fix the errors, add connectors and a little concrete detail, natural spoken English, 110-160 words',
    'EXPR: a useful expression taken from BETTER :: its Korean meaning',
    'TIP: one sentence in Korean on how to structure an answer to this type of question next time',
    'Write 0 to 3 FIX lines and exactly 3 EXPR lines. If there is no answer, give SCORE 0, write no FIX lines, and make BETTER a model answer at IM3 to IH level.'
  ].join('\n');
}
function parseStudy(text) {
  const r = { score: null, level: '', feedback: '', fixes: [], better: '', exprs: [], tip: '' };
  const unq = s => s.trim().replace(/^["“'`]+|["”'`]+$/g, '');
  let last = null;
  String(text).split(/\r?\n/).forEach(line => {
    const m = line.replace(/^[\s*#>\-]+/, '').match(/^(SCORE|LEVEL|FEEDBACK|FIX|BETTER|EXPR|TIP)\s*\**\s*[:：]\s*\**\s*(.*)$/i);
    if (!m) { const t = line.trim(); if (t && last) r[last] += (r[last] ? ' ' : '') + t; return; }
    const k = m[1].toUpperCase(), v = m[2].trim();
    last = null;
    if (k === 'SCORE') { const n = parseFloat(v); if (!isNaN(n)) r.score = clamp(Math.round(n * 2) / 2, 0, 5); }
    else if (k === 'LEVEL') { const lv = v.toUpperCase().replace(/[^A-Z0-9]/g, ''); r.level = LEVELS.includes(lv) ? lv : ''; }
    else if (k === 'FEEDBACK') { r.feedback = v; last = 'feedback'; }
    else if (k === 'BETTER') { r.better = v; last = 'better'; }
    else if (k === 'TIP') { r.tip = v; last = 'tip'; }
    else if (k === 'FIX') { const p = v.split('=>'); if (p.length > 1) { const w = p.slice(1).join('=>').split('::'); r.fixes.push({ from: unq(p[0]), to: unq(w[0]), why: w.slice(1).join(' ').trim() }); } }
    else if (k === 'EXPR') { const p = v.split('::'); if (p[0].trim()) r.exprs.push({ en: unq(p[0]), ko: p.slice(1).join(' ').trim() }); }
  });
  return r;
}
function fixesHtml(fixes) {
  return `<ul class="fixes">${fixes.map(f => `<li><del lang="en">${esc(f.from)}</del><ins lang="en">${esc(f.to)}</ins>${f.why ? `<span>${esc(f.why)}</span>` : ''}</li>`).join('')}</ul>`;
}
function fbHtml(r, raw) {
  if (r.score == null && !r.feedback && !r.better) return raw ? `<p class="a-en">${esc(raw)}</p>` : '<p class="note">피드백을 쓰는 중이에요…</p>';
  return `<div class="row">${r.score != null ? `<span class="pill ${r.score >= 4 ? 'hi' : r.score < 2 ? 'lo' : ''}">${r.score}/5</span>` : ''}${r.level ? `<span class="pill">이 답변 수준 ${r.level}</span>` : ''}</div>
    ${r.feedback ? `<p>${esc(r.feedback)}</p>` : ''}
    ${r.fixes.length ? `<h4>이렇게 고쳐 보세요</h4>${fixesHtml(r.fixes)}` : ''}
    ${r.better ? `<h4>더 좋은 답변</h4><p class="model" lang="en">${esc(r.better)}</p>` : ''}
    ${r.exprs.length ? `<h4>핵심 표현</h4><ul class="plain">${r.exprs.map(x => `<li><b lang="en">${esc(x.en)}</b>${x.ko ? ' ' + esc(x.ko) : ''}</li>`).join('')}</ul>` : ''}
    ${r.tip ? `<h4>다음에는 이렇게</h4><p>${esc(r.tip)}</p>` : ''}`;
}
async function studyFeedback() {
  if (busy) { busy.abort(); return; }
  const E = S.exam, i = E.idx, sheet = $('#fbSheet'), body = $('#fbBody');
  const ctl = busy = new AbortController();
  const here = () => S.phase === 'exam' && S.exam === E && E.idx === i && !!$('#fbBody');
  const fail = msg => {
    if (busy === ctl) busy = null;
    if (!here()) return;
    if (msg) body.innerHTML = `<p class="status err">${esc(msg)}</p>`; else sheet.hidden = true;
    syncExam();
  };
  sheet.hidden = false; body.innerHTML = '<p class="note">AI가 답변을 읽고 있어요…</p>'; syncExam();
  sheet.scrollIntoView({ block: 'start' });
  await settleAnswer();
  const sample = await pSample;
  if (ctl.signal.aborted || !here()) return fail('');
  if (!sample) return fail('AI에 연결하지 못했어요. Claude에 로그인한 상태에서 이 페이지를 다시 열어 주세요.');
  let text;
  try {
    text = (await sample(studyPrompt(E.questions[i], E.answers[i]), { modelTier: 'default', signal: ctl.signal,
      onText: ({ text }) => { if (here()) body.innerHTML = fbHtml(parseStudy(text), ''); } })).text;
  } catch (e) { return fail(aiError(e)); }
  if (ctl.signal.aborted) return fail('');
  const fb = parseStudy(text); fb.raw = text;
  E.fb[i] = fb; if (busy === ctl) busy = null; save();
  if (here()) { body.innerHTML = fbHtml(fb, text); syncExam(); }
}
function retryQuestion() {
  const E = S.exam;
  stopSpeaking();
  E.fb[E.idx] = null; E.answers[E.idx] = { text: '', sec: 0, voice: false };
  save(); render();
}
function finishExam(timeUp) { clearInterval(tick); if (busy) { busy.abort(); busy = null; } S.exam.timeUp = !!timeUp; S.phase = 'done'; save(); render(); }
function startTick() { clearInterval(tick); tick = setInterval(onTick, 500); onTick(); }
function onTick() {
  if (S.phase !== 'exam') { clearInterval(tick); return; }
  const c = $('#clock'), el = $('#elapsed');
  if (el) el.textContent = mmss(curSec());
  if (!S.exam.endsAt) return;                 // study mode has no time limit
  const left = (S.exam.endsAt - Date.now()) / 1000;
  if (c) { c.textContent = mmss(left); c.classList.toggle('low', left < 300); }
  if (left <= 0) { clearInterval(tick); settleAnswer().then(() => finishExam(true)); }
}
function askQuit() {
  const study = S.exam.mode === 'study';
  $('#quitRow').innerHTML = `<span class="note">${study ? '학습을' : '시험을'} 멈출까요?</span>
    <button type="button" class="btn link" id="quitSubmit">${study ? '여기까지 하고 마치기' : '여기까지만 채점받기'}</button>
    <button type="button" class="btn link" id="quitDrop">기록 버리고 처음으로</button>
    <button type="button" class="btn link" id="quitNo">계속 보기</button>`;
}
function goHome() { stopSpeaking(); clearInterval(tick); if (busy) busy.abort(); busy = null; S.phase = 'setup'; S.exam = null; S.result = null; save(); render(); }

/* ---------- done + grading ---------- */
function renderDone() {
  const E = S.exam, study = E.mode === 'study', answered = E.answers.filter(a => a.text.trim()).length;
  app.innerHTML = `
  <header class="mast">
    <p class="eyebrow mono">${study ? 'Practice' : 'Test'} Completed · ${esc(E.label)}</p>
    <h1>${study ? '학습을 마쳤어요' : E.timeUp ? '시험 시간이 끝났어요' : '시험이 끝났어요'}</h1>
    <p class="lede">${E.questions.length}문항 중 ${answered}문항에 답했어요. ${answered ? (study ? '원하면 전체 답변을 모아 예상 등급도 받아볼 수 있어요. ' : '') + '채점은 가장 성능이 높은 모델이 맡아요. 보통 1~2분 걸려요.' : '답변이 하나도 없어서 채점할 내용이 없어요.'}</p>
  </header>
  <section class="sheet">
    <button type="button" class="btn primary big" id="gradeBtn" ${answered ? '' : 'disabled'}>${study ? '전체 채점받기' : 'AI 채점받기'}</button>
    <p class="status" id="gradeStatus" role="status"></p>
    <div class="row">${study ? '<button type="button" class="btn link" id="backBtn">문제로 돌아가기</button>' : ''}<button type="button" class="btn link" id="homeBtn">${study ? '처음으로' : '채점 없이 처음으로'}</button></div>
  </section>`;
}
async function grade() {
  if (busy) { busy.abort(); return; }
  const btn = $('#gradeBtn'), st = $('#gradeStatus'), t0 = Date.now(), label = btn.textContent;
  const ctl = busy = new AbortController();
  btn.textContent = '채점 취소'; st.className = 'status'; st.textContent = 'AI가 답변을 읽고 있어요…';
  const fail = msg => { if (busy === ctl) busy = null; if (S.phase !== 'done' || !btn.isConnected) return; btn.textContent = label; btn.disabled = CAP.sampleOff; st.className = 'status err'; st.textContent = msg; };
  const sample = await pSample;
  if (ctl.signal.aborted) return fail('');
  if (!sample) return fail('AI에 연결하지 못했어요. Claude에 로그인한 상태에서 이 페이지를 다시 열어 주세요.');
  let raw;
  try {
    raw = await sample.json(gradePrompt(S.exam), { modelTier: 'complex', effort: 'high', cache: false, signal: ctl.signal,
      onText: ({ text }) => { st.textContent = `채점 결과를 정리하고 있어요… ${Math.round((Date.now() - t0) / 1000)}초 (${text.length}자)`; } });
  } catch (e) { return fail(aiError(e)); }
  try { S.result = normResult(raw, S.exam.questions.length); } catch (e) { return fail('채점 결과가 온전히 오지 않았어요. 다시 눌러 주세요.'); }
  busy = null; S.phase = 'result'; save(); render();
}

/* ---------- result screen ---------- */
function renderResult() {
  const R = S.result, E = S.exam;
  const qa = E.questions.map((q, i) => {
    const a = E.answers[i], g = R.questions[i] || { score: 0, feedback: '', fixes: [] }, has = a.text.trim(), f = E.fb && E.fb[i];
    return `<details class="qa">
      <summary><span class="mono">Q${pad(q.no)}</span><span class="qt">${esc(q.topicKo)} · ${esc(q.typeKo)}</span><span class="pill ${g.score >= 4 ? 'hi' : g.score < 2 ? 'lo' : ''}">${g.score}/5</span></summary>
      <div class="qa-body">
        <p class="qtext" lang="en">${esc(q.text)}</p>
        <h4>내 답변</h4>
        <p class="a-en" lang="en">${has ? esc(a.text.trim()) : '(답변 없음)'}</p>
        <p class="note mono">${esc(q.catKo)} · ${mmss(a.sec)} · ${words(a.text)}단어 · ${a.voice ? '음성' : '입력'}</p>
        ${g.feedback ? `<h4>피드백</h4><p>${esc(g.feedback)}</p>` : ''}
        ${g.fixes.length ? `<h4>이렇게 고쳐 보세요</h4>${fixesHtml(g.fixes)}` : ''}
        ${f && f.better ? `<h4>더 좋은 답변</h4><p class="model" lang="en">${esc(f.better)}</p>`
          : `<div class="row"><button type="button" class="btn" data-model="${i}">한 단계 위 답변으로 고쳐 보기</button></div>
        <p class="model" id="model-${i}" lang="en" hidden></p>`}
      </div>
    </details>`;
  }).join('');
  app.innerHTML = `
  <header class="mast">
    <p class="eyebrow mono">Mock Test Result · ${esc(E.label)}</p>
    <h1>채점 결과</h1>
  </header>
  <section class="sheet">
    <p class="grade-label">예상 등급</p>
    <p class="grade-big">${esc(R.level)}</p>
    ${ladderHtml(R.level)}
    <p>${esc(R.summary)}</p>
    <p class="note">글로 옮긴 답변만 보고 추정한 참고용 등급이에요. 발음, 억양, 말의 속도감은 평가에 들어가지 않았어요.</p>
  </section>
  <section class="sheet">
    <h2>영역별 점수</h2>
    <div class="bars">${SCORE_LABELS.map(([k, label]) => `<span>${label}</span><span class="bar"><i style="width:${R.scores[k] * 20}%"></i></span><span class="mono">${R.scores[k].toFixed(1)}</span>`).join('')}</div>
  </section>
  ${R.strengths.length ? `<section class="sheet"><h2>잘한 점</h2><ul class="plain">${R.strengths.map(s => `<li>${esc(s)}</li>`).join('')}</ul></section>` : ''}
  ${R.priorities.length ? `<section class="sheet"><h2>먼저 고칠 점</h2><ol class="plain">${R.priorities.map(s => `<li>${esc(s)}</li>`).join('')}</ol></section>` : ''}
  <section class="sheet"><h2>문항별 피드백</h2><div>${qa}</div></section>
  <button type="button" class="btn primary big" id="homeBtn">새 문제로 다시 보기</button>`;
}
async function modelAnswer(btn) {
  const i = Number(btn.dataset.model), out = $('#model-' + i);
  btn.disabled = true; out.hidden = false; out.textContent = '모범 답안을 쓰는 중이에요…';
  const sample = await pSample;
  if (!sample) { out.textContent = 'AI에 연결하지 못했어요.'; btn.disabled = false; return; }
  try {
    const r = await sample(modelPrompt(S.exam.questions[i], S.exam.answers[i], S.result.level), { modelTier: 'default', onText: ({ text }) => { out.textContent = text; } });
    out.textContent = r.text; btn.hidden = true;
  } catch (e) {
    out.textContent = (e && e.text ? e.text + '\n\n' : '') + aiError(e);
    btn.disabled = CAP.sampleOff;
  }
}

/* ---------- wiring ---------- */
function render() {
  ({ setup: renderSetup, exam: renderExam, done: renderDone, result: renderResult }[S.phase] || renderSetup)();
  window.scrollTo(0, 0);
}
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const d = b.dataset, p = S.prefs;
  if (d.provider) { CONN.provider = d.provider; saveConn(); return renderSetup(); }
  if (b.id === 'keyCheck') return void checkKey();
  if (d.topic) {
    const on = !p.topics.includes(d.topic);
    p.topics = on ? p.topics.concat(d.topic) : p.topics.filter(t => t !== d.topic);
    b.setAttribute('aria-pressed', on); paintSetup(); save(); return;
  }
  for (const k of ['level', 'adjust', 'surprise', 'mode']) if (d[k]) {
    p[k] = k === 'level' ? Number(d[k]) : d[k];
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    paintSetup(); save(); return;
  }
  if (d.model) return void modelAnswer(b);
  switch (b.id) {
    case 'startBtn': return void startExam();
    case 'playBtn': return void playQuestion();
    case 'textBtn': {
      const t = $('#qtext');
      if (t.hidden) revealText(''); else { t.hidden = true; b.setAttribute('aria-expanded', 'false'); b.textContent = '문제 글로 보기'; }
      return;
    }
    case 'micBtn': return micClick();
    case 'nextBtn': case 'skipBtn': return void go(1);
    case 'prevBtn': return void go(-1);
    case 'fbBtn': return void studyFeedback();
    case 'retryBtn': return retryQuestion();
    case 'backBtn': if (busy) busy.abort(); busy = null; S.phase = 'exam'; save(); return render();
    case 'quitBtn': return askQuit();
    case 'quitNo': $('#quitRow').innerHTML = quitRowHtml(); return syncExam();
    case 'quitSubmit': return void settleAnswer().then(() => finishExam(false));
    case 'quitDrop': case 'homeBtn': if (CAP.dict && micState !== 'idle') CAP.dict.stop().catch(() => {}); return goHome();
    case 'gradeBtn': return void grade();
  }
});
app.addEventListener('change', e => {
  if (e.target.id === 'status' || e.target.id === 'home') { S.prefs[e.target.id] = e.target.value; save(); }
  if (e.target.id === 'aiModel') { conn().model = e.target.value; saveConn(); paintCaps(); }
  if (e.target.id === 'aiGrade') { conn().grade = e.target.value; saveConn(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'apiKey') { conn().key = e.target.value.trim(); saveConn(); paintCaps(); return; }
  if (e.target.id !== 'ans' || S.phase !== 'exam') return;
  beginAnswer(); curA().text = e.target.value; updateWc(); saveSoon();
  if (S.exam.mode === 'study') syncExam();
});

function boot(data) { adopt(data && data.prefs ? data : store.get()); render(); }
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => S); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || null);
})();
</script>
